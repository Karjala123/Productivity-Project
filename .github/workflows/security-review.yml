name: Security Vulnerability Review

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  security-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Run Security Vulnerability Scan
        run: python test/security/generate_security_report.py

      - name: Zero-Critical Security Gate
        run: |
          echo "Checking for Critical or High severity findings..."
          CRITICAL_COUNT=$(grep -c "Critical" executive-summary.md | head -1 || echo "0")
          HIGH_COUNT=$(grep -c "High" executive-summary.md | head -1 || echo "0")

          # Parse actual counts from the table rows
          CRITICAL_ACTUAL=$(grep "Critical" executive-summary.md | grep -oP '\|\s*\K[0-9]+' | head -1 || echo "0")
          HIGH_ACTUAL=$(grep "High" executive-summary.md | grep -oP '\|\s*\K[0-9]+' | head -1 || echo "0")

          echo "Critical findings: $CRITICAL_ACTUAL"
          echo "High findings: $HIGH_ACTUAL"

          if [ "$CRITICAL_ACTUAL" -gt 0 ] 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED: $CRITICAL_ACTUAL Critical vulnerabilities detected!"
            exit 1
          fi

          if [ "$HIGH_ACTUAL" -gt 0 ] 2>/dev/null; then
            echo "::error::SECURITY GATE FAILED: $HIGH_ACTUAL High vulnerabilities detected!"
            exit 1
          fi

          echo "✅ Zero-Critical Security Policy: PASSED (0 Critical, 0 High)"

      - name: Publish Executive Summary to Step Summary
        if: always()
        run: |
          echo "## 🛡️ Security Vulnerability Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat executive-summary.md >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Detailed Security Findings" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat security-review.md >> $GITHUB_STEP_SUMMARY

      - name: Upload Vulnerability Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-Vulnerability-Report
          path: vulnerability-findings.xlsx
