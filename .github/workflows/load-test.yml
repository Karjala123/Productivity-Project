name: API Load Test (k6)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup k6 Engine
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test (100 VUs x 1 minute)
        run: |
          k6 run \
            --summary-export=summary.json \
            --env BACKEND_URL=https://productivityai-backend.onrender.com \
            test/loadtest/load-test.js || true

      - name: Parse and Publish Load Test Results
        if: always()
        run: python test/loadtest/parseK6Summary.py summary.json

      - name: Upload k6 Summary JSON Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-Load-Test-Summary
          path: summary.json
